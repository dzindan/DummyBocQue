<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Kinh Dịch{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='48' fill='%23e8e6e6'/><path d='M50,2 A24,24 0 0,1 50,50 A24,24 0 0,0 50,98 A48,48 0 0,0 50,2 Z' fill='%231a1a1a'/><circle cx='50' cy='26' r='8' fill='%23e8e6e6'/><circle cx='50' cy='74' r='8' fill='%231a1a1a'/></svg>">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('home.index') }}">☯ Kinh Dịch</a>
    <nav>
      <a href="{{ url_for('hexagram.list_hexagrams') }}">Tra cứu 64 quẻ</a>
      <a href="{{ url_for('divination.form') }}">Gieo quẻ</a>
      <a href="{{ url_for('divination.history') }}">Lịch sử</a>
      <a href="{{ url_for('notes.list_notes') }}">Ghi chú</a>
      <a href="{{ url_for('study.quiz') }}">Học tập</a>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="footer">Kinh Dịch App v{{ app_version }}</footer>
</body>
</html>
