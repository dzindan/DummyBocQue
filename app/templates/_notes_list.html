{% if notes %}
<ul class="note-list">
  {% for n in notes %}
  <li>
    <span class="note-date">{{ n.created_at[:16] }}</span>
    <p>{{ n.content }}</p>
    {% if n.tags %}<span class="tags">{% for t in n.tags %}<em>#{{ t }}</em>{% endfor %}</span>{% endif %}
  </li>
  {% endfor %}
</ul>
{% else %}
<p class="muted">Chưa có ghi chú.</p>
{% endif %}
